<html lang="bn">
  <head>

    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="মাদ্রাসা" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <title>LDSDM System · Madrasah Management Platform</title>
    <meta name="description" content="LDSDM System - Modern SaaS Madrasah Management Platform for managing students, attendance, exams, marks, subjects, and financial operations." />
    <meta property="og:title" content="LDSDM System · Madrasah Management Platform" />
    <meta property="og:description" content="LDSDM System - Modern SaaS Madrasah Management Platform for managing students, attendance, exams, marks, subjects, and financial operations." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Anek Bangla', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
              bangla: ['Anek Bangla', 'sans-serif'],
              mono: ['Inter', 'Anek Bangla', 'monospace']
            },
            boxShadow: {
              'soft': '0 1px 3px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.02)',
              'card': '0 1px 3px rgba(0,0,0,0.05), 0 12px 24px -4px rgba(0,0,0,0.04)',
              'elevated': '0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.06)'
            }
          }
        }
      };
    </script>
    <script>
      // Filter transient Firestore offline / reconnect log notices from registering as runtime errors
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          try {
            const str = args.map(a => typeof a === 'string' ? a : (a?.message || a?.toString?.() || '')).join(' ');
            if (str.includes('Could not reach Cloud Firestore backend') || (str.includes('@firebase/firestore') && str.includes('unavailable'))) {
              console.debug('[Firestore Offline/Reconnect Notice]', ...args);
              return;
            }
          } catch (_) {}
          origError.apply(console, args);
        };
      })();
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alkatra:wght@400;500;600;700&family=Anek+Bangla:wght@300;400;500;600;700;800&family=Atma:wght@400;500;600;700&family=Baloo+Da+2:wght@400;500;600;700;800&family=Galada&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Mina:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap');
      
      :root {
        --color-brand: #0d9488;
        --color-brand-hover: #0f766e;
        --color-brand-light: #f0fdfa;
        --color-brand-ring: #14b8a6;
        --bangla-font: 'Anek Bangla', sans-serif;
        --bangla-num-font: 'Anek Bangla', sans-serif;
        /* On-screen UI font: Latin from Inter; Bengali glyphs and Bengali
           digits render with Anek Bangla (crystal-clear, never clips numbers). */
        --ui-font: 'Inter', 'Anek Bangla', sans-serif;
      }

      [data-theme="indigo"] {
        --color-brand: #4f46e5;
        --color-brand-hover: #4338ca;
        --color-brand-light: #eef2ff;
        --color-brand-ring: #6366f1;
      }

      [data-theme="blue"] {
        --color-brand: #2563eb;
        --color-brand-hover: #1d4ed8;
        --color-brand-light: #eff6ff;
        --color-brand-ring: #3b82f6;
      }

      [data-theme="emerald"] {
        --color-brand: #059669;
        --color-brand-hover: #047857;
        --color-brand-light: #ecfdf5;
        --color-brand-ring: #10b981;
      }

      [data-theme="amber"] {
        --color-brand: #d97706;
        --color-brand-hover: #b45309;
        --color-brand-light: #fffbeb;
        --color-brand-ring: #f59e0b;
      }

      [data-theme="teal"] {
        --color-brand: #0d9488;
        --color-brand-hover: #0f766e;
        --color-brand-light: #f0fdfa;
        --color-brand-ring: #14b8a6;
      }

      html.dark {
        color-scheme: dark;
      }

      html.dark body {
        background-color: #0b0f19 !important;
        color: #f1f5f9 !important;
      }
      
      
      body {
        font-family: var(--ui-font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
      }
      
      select, option, input, textarea, button {
        font-family: var(--ui-font) !important;
      }

      .font-mono {
        font-family: 'Inter', 'Anek Bangla', monospace !important;
        font-variant-numeric: tabular-nums;
      }

      .font-bangla {
        font-family: var(--bangla-font) !important;
        font-weight: 500;
        letter-spacing: normal !important;
        word-spacing: normal !important;
      }

      .font-arabic {
        font-family: 'IBM Plex Sans Arabic', sans-serif !important;
      }

      .font-bangla .font-mono {
        font-family: var(--bangla-num-font) !important;
      }

      .font-anek {
        font-family: 'Anek Bangla', sans-serif !important;
      }

      .font-baloo {
        font-family: 'Baloo Da 2', 'Anek Bangla', sans-serif !important;
      }

      .font-mina {
        font-family: 'Mina', 'Anek Bangla', sans-serif !important;
      }

      .font-atma {
        font-family: 'Atma', 'Anek Bangla', cursive !important;
      }

      .font-galada {
        font-family: 'Galada', 'Anek Bangla', cursive !important;
      }

      .font-alkatra {
        font-family: 'Alkatra', 'Anek Bangla', cursive !important;
      }

      .font-serif-bn {
        font-family: 'Tiro Bangla', 'Anek Bangla', serif !important;
      }

      .font-inter {
        font-family: 'Inter', sans-serif !important;
      }

      .font-hind {
        font-family: 'Anek Bangla', sans-serif !important;
      }

      /* Notice Board Marquee Animation */
      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        display: inline-flex;
        animation: marquee 30s linear infinite;
        will-change: transform;
      }

      /* Mobile Role App Scaling & Zero-Horizontal-Scroll Suite */
      .mobile-role-app-container {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .mobile-role-app-container table {
        width: 100% !important;
        max-width: 100% !important;
      }

      .mobile-role-app-container th,
      .mobile-role-app-container td {
        white-space: normal !important;
        word-break: break-word !important;
        padding-left: 0.375rem !important;
        padding-right: 0.375rem !important;
        font-size: 0.75rem !important;
      }

      .mobile-role-app-container .overflow-x-auto {
        overflow-x: hidden !important;
      }

      .mobile-responsive-viewport {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden !important;
      }

      .mobile-responsive-table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: auto;
        border-collapse: collapse;
      }

      .mobile-card-list-view {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        width: 100%;
      }

      .no-horizontal-scroll {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 8px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Print Styles */
      @media print {
        @page {
          margin: 0;
          size: auto;
        }

        body {
          background-color: white !important;
          color: black !important;
          padding: 0 !important;
          margin: 0 !important;
          font-size: 12pt;
        }

        .print\\:hidden,
        aside,
        nav,
        header,
        button:not(.print-include),
        .no-print {
          display: none !important;
        }

        main {
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          box-shadow: none !important;
        }

        .print-container {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          box-shadow: none !important;
          border: none !important;
          background: white !important;
        }

        .result-card-print {
          page-break-after: always;
          break-after: page;
          margin: 0 auto;
          box-shadow: none !important;
          border-radius: 0 !important;
        }

        /* 2 Result cards per page */
        .two-per-page {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          margin-bottom: 0 !important;
        }

        .two-per-page:nth-child(even) {
          page-break-after: always !important;
          break-after: page !important;
          border-bottom: none !important;
        }

        /* A4 sheet page layout */
        .a4-sheet-page {
          width: 210mm !important;
          max-width: 210mm !important;
          min-height: 297mm !important;
          height: 297mm !important;
          page-break-after: always !important;
          break-after: page !important;
          break-inside: avoid !important;
          margin: 0 !important;
          padding: 8mm 6mm !important;
          box-sizing: border-box !important;
          background: white !important;
        }

        table, th, td {
          border-color: #333 !important;
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); margin-bottom: 16px; animation: pulse 2s infinite;">
          🕌
        </div>
        <h2 style="font-size: 18px; font-weight: 800; margin: 0 0 6px 0; color: #f8fafc; letter-spacing: -0.02em;">
          মাদ্রাসা ম্যানেজমেন্ট সিস্টেম
        </h2>
        <p style="font-size: 12px; color: #94a3b8; margin: 0 0 20px 0;">
          অ্যাপটি লোড হচ্ছে, অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন...
        </p>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        </style>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
