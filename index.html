    <script>
      // Guard against libraries trying to overwrite read-only window.fetch
      // This error often occurs when a library (like html2pdf.js) bundles a fetch polyfill
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            // Try to make it configurable first
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}

            // Now define with a dummy setter to prevent "only a getter" errors
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { 
                console.warn('Blocked attempt to overwrite window.fetch');
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.error('Fetch guard failed:', e);
        }
      })();
    </script>

      @media print {
        @page {
          size: A4;
          margin: 6mm 6mm;
        }

        /* Reset all animations, transitions, and transforms that cause browser print clipping */
        *, *::before, *::after {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          animation: none !important;
          transition: none !important;
          box-shadow: none !important;
          text-shadow: none !important;
        }

        body {
          margin: 0 !important;
          padding: 0 !important;
          background-color: white !important;
          background: white !important;
          color: black !important;
          overflow: visible !important;
        }

        /* Reset structural containers to prevent blank pages & overflow clipping */
        html, body, #root, .h-screen, .h-full, .overflow-hidden, .overflow-auto, .overflow-y-auto {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          position: static !important;
        }

        /* Hide navigation, sidebars, headers, toolbars and interactive buttons */
        header, aside, nav, footer, button, .no-print, .print\:hidden, input:not([type="checkbox"]), select, [role="navigation"] {
          display: none !important;
        }

        /* If .print-container exists, isolate and display it prominently */
        body:has(.print-container) * {
          visibility: hidden;
        }

        body:has(.print-container) .print-container,
        body:has(.print-container) .print-container * {
          visibility: visible !important;
        }

        .print-container {
          position: static !important;
          display: block !important;
          visibility: visible !important;
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
        }

        /* Reset modal overlay containers during print */
        .fixed, [class*="fixed"] {
          position: static !important;
          inset: auto !important;
          background: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          border: none !important;
          overflow: visible !important;
          transform: none !important;
          filter: none !important;
          backdrop-filter: none !important;
        }

        /* Page breaks */
        .page-break {
          page-break-after: always !important;
          break-after: page !important;
          break-inside: avoid !important;
          margin-bottom: 0 !important;
          border: 1px solid #ddd !important;
          width: 100% !important;
          max-width: none !important;
        }

        /* Support for 2 cards per page */
        .two-per-page {
          height: 138mm !important;
          page-break-after: auto !important;
          break-after: auto !important;
          margin-bottom: 8mm !important;
          border-bottom: 1px dashed #ccc !important;
        }

        .two-per-page:nth-child(even) {
          page-break-after: always !important;
          break-after: page !important;
          border-bottom: none !important;
        }

        /* A4 sheet page layout */
        .a4-sheet-page {
          width: 210mm !important;
          max-width: 210mm !important;
          min-height: 297mm !important;
          height: 297mm !important;
          page-break-after: always !important;
          break-after: page !important;
          break-inside: avoid !important;
          margin: 0 !important;
          padding: 8mm 6mm !important;
          box-sizing: border-box !important;
          background: white !important;
        }

        table, th, td {
          border-color: #333 !important;
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
          display: none !important;
        }
      }
