    <script>
      // Guard against libraries trying to overwrite read-only window.fetch
      // This error often occurs when a library (like html2pdf.js) bundles a fetch polyfill
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            // Try to make it configurable first
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}

            // Now define with a dummy setter to prevent "only a getter" errors
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) { 
                console.warn('Blocked attempt to overwrite window.fetch');
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.error('Fetch guard failed:', e);
        }
      })();
    </script>

      @media print {
        @page {
          size: A4;
          margin: 0;
        }

        /* 
           STRATEGY: 
           1. Hide everything in the body by default using visibility (preserves layout calculations but hides pixels).
           2. Make the .print-container visible.
           3. Position .print-container absolutely at (0,0) to overlay any hidden app shell elements.
           4. Reset height/overflow constraints on root elements so the print job sees all pages.
        */

        body {
          margin: 0;
          padding: 0;
          background-color: white;
        }

        /* Hide generic app elements */
        body * {
          visibility: hidden;
        }

        /* Reset structural constraints that cause clipping */
        html, body, #root, .h-screen, .h-full, .overflow-hidden, .overflow-auto {
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
        }

        /* Show the print container and its children */
        .print-container, .print-container * {
          visibility: visible;
        }

        /* Position the content to print at the top-left */
        .print-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
        }

        /* Ensure standard elements are hidden to be safe */
        header, aside, nav, button, .no-print, .print\:hidden, input, select {
          display: none !important;
        }

        /* Card styling for print */
        .page-break {
          page-break-after: always !important;
          break-after: page !important;
          break-inside: avoid !important;
          margin-bottom: 0 !important;
          box-shadow: none !important;
          border: 1px solid #ddd !important;
          width: 100% !important;
          max-width: none !important;
        }

        /* Support for 2 cards per page */
        .two-per-page {
          height: 140mm !important; /* Approx half A4 height minus some margin */
          page-break-after: auto !important;
          break-after: auto !important;
          margin-bottom: 10mm !important;
          border-bottom: 1px dashed #ccc !important;
        }

        .two-per-page:nth-child(even) {
          page-break-after: always !important;
          break-after: page !important;
          border-bottom: none !important;
        }

        /* Support for 2-subject Marksheet A4 layout */
        .a4-sheet-page {
          width: 210mm !important;
          max-width: 210mm !important;
          min-height: 297mm !important;
          height: 297mm !important;
          page-break-after: always !important;
          break-after: page !important;
          break-inside: avoid !important;
          margin: 0 !important;
          padding: 8mm 6mm !important;
          box-sizing: border-box !important;
          background: white !important;
        }

        /* Ensure borders and colors print correctly */
        table, th, td {
          border-color: #000 !important;
        }
        
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        /* Hide scrollbars */
        ::-webkit-scrollbar {
          display: none;
        }
      }
