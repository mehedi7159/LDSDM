<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.6" />

  <!-- Inner Dome / Crescent Arch -->
  <path d="M 256 90 C 210 140, 160 190, 160 270 C 160 340, 200 370, 256 370 C 312 370, 352 340, 352 270 C 352 190, 302 140, 256 90 Z" 
        fill="url(#accentGrad)" opacity="0.15" />

  <!-- Minaret & Dome Outline -->
  <path d="M 256 95 C 220 145, 180 190, 180 260 C 180 320, 215 350, 256 350 C 297 350, 332 320, 332 260 C 332 190, 292 145, 256 95 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crescent on top -->
  <path d="M 256 70 A 18 18 0 1 0 256 102 A 13 13 0 1 1 256 70" fill="url(#goldGrad)" />
  
  <!-- Open Book (Quran / Knowledge) -->
  <g transform="translate(146, 270)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M 110 30 C 70 15, 20 20, 0 35 L 0 110 C 20 95, 70 90, 110 105 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 15 50 C 40 40, 80 40, 100 52" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 15 68 C 40 58, 80 58, 100 70" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 15 86 C 40 76, 80 76, 100 88" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Right Page -->
    <path d="M 110 30 C 150 15, 200 20, 220 35 L 220 110 C 200 95, 150 90, 110 105 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 205 50 C 180 40, 140 40, 120 52" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 205 68 C 180 58, 140 58, 120 70" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <path d="M 205 86 C 180 76, 140 76, 120 88" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Book Spine -->
    <path d="M 110 28 L 110 110" stroke="#eab308" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Stars / Radiance -->
  <circle cx="160" cy="180" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="352" cy="180" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="210" cy="150" r="3" fill="#38bdf8" opacity="0.9" />
  <circle cx="302" cy="150" r="3" fill="#38bdf8" opacity="0.9" />
</svg>
